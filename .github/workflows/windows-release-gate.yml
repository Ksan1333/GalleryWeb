name: Windows release gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Verify Windows signing tools before the long build
        shell: pwsh
        run: |
          Get-Command Get-AuthenticodeSignature -ErrorAction Stop | Out-Null
          Get-AuthenticodeSignature -LiteralPath (Join-Path $PSHOME 'pwsh.exe') -ErrorAction Stop | Out-Null

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build frontend
        run: npm run build

      - name: Prepare pinned libVLC runtime
        run: npm run prepare:libvlc

      - name: Verify performance, themes and layout contract
        run: |
          npm run perf:budget
          npm run test:performance
          npm run test:themes
          npm run test:layout
          npm run test:library
          npm run test:gallery-consistency
          npm run test:explorer-navigation
          npm run test:book-viewer
          npm run test:settings
          npm run test:thumbnail-coordinator
          npm run test:media-visual-admission

      - name: Install isolated headless browser
        run: npx playwright install chromium

      - name: Verify headless layout and large-library workflows
        run: |
          npm run test:filesystem-layout
          npm run test:startup-performance
          npm run test:external-explorer
          npm run test:external-first-paint
          npm run test:viewer-interactions
          npm run test:video-playback
          npm run test:pdf-book

      - name: Verify Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run release tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --release

      - name: Benchmark the thumbnail pipeline
        run: |
          npm run perf:thumbnails -- -Rounds 7 -BatchItems 32 -JsonPath artifacts/thumbnail-benchmark.json
          npm run perf:thumbnails:check -- artifacts/thumbnail-benchmark.json

      - name: Build NSIS installer
        run: npm run build:installer

      - name: Verify generated file associations
        env:
          PIXVAULT_REQUIRE_GENERATED_NSIS: "1"
        run: npm run test:external-file-open

      - name: Validate release metadata and installer
        # Do not spawn Windows PowerShell 5 from the runner's PowerShell 7:
        # inherited module paths can prevent the Security module from loading.
        shell: pwsh
        run: ./scripts/check-release-artifacts.ps1

      - name: Upload installer and manifest
        uses: actions/upload-artifact@v7
        with:
          name: pixvault-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/release-manifest.json
            src-tauri/target/libvlc/vlc-3.0.23.tar.xz
            artifacts/thumbnail-benchmark.json
          if-no-files-found: error
          retention-days: 14
